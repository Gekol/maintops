services:
  - type: web
    name: maintops
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 150
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABRICKS_HOST
        sync: false  # set manually in Render dashboard
      - key: DATABRICKS_CLIENT_ID
        sync: false  # service principal (preferred): the app renews its own Databricks token
      - key: DATABRICKS_CLIENT_SECRET
        sync: false  # service principal OAuth secret (sensitive)
      - key: DATABRICKS_TOKEN
        sync: false  # fallback without a service principal: PAT or 1-hour OAuth token (sensitive)
      - key: MANNY_ENDPOINT
        sync: false  # set manually in Render dashboard (Model Serving endpoint of the Manny agent)
      - key: DATABRICKS_WAREHOUSE_ID
        sync: false  # set manually in Render dashboard (SQL warehouse that runs ai_parse_document for CV uploads)
      - key: LAKEBASE_PG_URL
        sync: false  # set manually in Render dashboard (sensitive)
      - key: GEOAPIFY_API_KEY
        sync: false  # set manually in Render dashboard (sensitive)
