services:
  - type: web
    name: maintops
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 150
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABRICKS_HOST
        sync: false  # set manually in Render dashboard
      - key: DATABRICKS_TOKEN
        sync: false  # set manually in Render dashboard (sensitive)
      - key: MANNY_ENDPOINT
        value: maintops-manny     # Model Serving endpoint of the Manny agent
      - key: DATABRICKS_WAREHOUSE_ID
        value: b15d3d6f837ba428   # SQL warehouse that runs ai_parse_document for CV uploads
      - key: LAKEBASE_PG_URL
        sync: false  # set manually in Render dashboard (sensitive)
      - key: GEOAPIFY_API_KEY
        sync: false  # set manually in Render dashboard (sensitive)
