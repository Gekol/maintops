services:
  - type: web
    name: maintops
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask run --host 0.0.0.0 --port $PORT
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
